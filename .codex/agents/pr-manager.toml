name = "pr-manager"
description = "Conventions obligatoires pour la création de Pull Requests par les agents GitHub Copilot."
developer_instructions = """
# Conventions Pull Request — InfraFlowSculptor\r
\r
> Ce fichier est lu par tous les agents GitHub Copilot avant de créer ou de soumettre une Pull Request.  \r
> Ces conventions sont **obligatoires** et non-négociables.\r
> Une PR ne doit pas etre soumise sans double revue technique : `review-main` / `review-expert` pour la merge-readiness et `vibe-coding-refractaire` pour la chasse aux odeurs de vibe coding.\r
\r
---\r
\r
## 1. Format du titre de PR\r
\r
### Règle absolue\r
\r
Le titre de la PR doit **toujours** décrire le **but principal** de la PR, jamais la dernière tâche effectuée.\r
\r
### Format\r
\r
```\r
type(scope): description courte du but principal\r
```\r
\r
- **type** : un des types listés ci-dessous (obligatoire)\r
- **scope** : composant ou aggregate concerné, en kebab-case (optionnel, mais recommandé)\r
- **description** : phrase courte au présent, sans majuscule initiale, sans point final\r
\r
### Types autorisés\r
\r
| Type       | Quand l'utiliser |\r
|------------|-----------------|\r
| `feat`     | Nouvelle fonctionnalité ou feature CQRS complète |\r
| `fix`      | Correction d'un bug ou d'un comportement incorrect |\r
| `refactor` | Restructuration sans changement fonctionnel |\r
| `perf`     | Amélioration des performances |\r
| `docs`     | Documentation uniquement (README, .Codex/memory/MEMORY.md, commentaires) |\r
| `test`     | Ajout ou modification de tests |\r
| `chore`    | Maintenance, mise à jour des dépendances, Dockerfile |\r
| `ci`       | Changements liés aux pipelines CI/CD / GitHub Actions |\r
| `style`    | Formatage, indentation, lint (aucun impact fonctionnel) |\r
| `revert`   | Annulation d'un commit ou d'une feature précédente |\r
\r
### Exemples corrects\r
\r
```\r
feat(storage-account): add StorageAccount aggregate with full CRUD\r
fix(key-vault): correct EF Core LINQ translation for KeyVaultId comparison\r
refactor(member): extract MemberCommandHelper to reduce duplication\r
feat(role-assignment): add role assignment management on Azure resources\r
chore: update Directory.Packages.props to latest package versions\r
docs: update .Codex/memory/MEMORY.md with StorageAccount conventions\r
```\r
\r
### Exemples incorrects ❌\r
\r
```\r
Add StorageAccountConfiguration.cs          ← dernière tâche, pas le but\r
WIP                                         ← pas de type ni description\r
Update files                                ← trop vague\r
feat: done                                  ← pas de description\r
```\r
\r
---\r
\r
## 2. Description de la PR\r
\r
Utiliser le **template `.github/PULL_REQUEST_TEMPLATE.md`** fourni dans ce dépôt.\r
\r
### Ce qui est obligatoire dans la description\r
\r
1. **But principal** — une phrase résumant l'objectif global de la PR\r
2. **Type de changement** — coche la ou les cases correspondantes\r
3. **Changements par couche** — pour chaque couche impactée :\r
   - Domaine : nouveaux agrégats, entités, value objects, erreurs\r
   - Application : commandes, queries, handlers, validators\r
   - Infrastructure : configurations EF Core, repositories, migrations\r
   - Contrats : requests, responses\r
   - API : endpoints, mappings Mapster\r
   - Frontend : components/routes/services/facades/guards/environments dans `src/Front`\r
4. **Migration EF Core** — indiquer si une migration a été ajoutée et son nom\r
5. **Checklist** — valider chaque point avant de soumettre\r
\r
### Règle : exhaustivité\r
\r
Chaque fichier créé ou modifié doit apparaître dans au moins une section de la description.  \r
Ne pas regrouper tous les changements en une seule ligne vague comme "ajout de la feature".\r
\r
---\r
\r
## 3. Protocole de création de PR pour les agents\r
\r
Quand un agent crée une PR, il doit :\r
\r
1. **Identifier le but principal** de l'ensemble du travail effectué (pas la dernière modification).\r
2. **Construire le titre** selon le format `type(scope): description`.\r
3. **Remplir la description** en utilisant le template et en listant **tous** les fichiers créés ou modifiés, groupés par couche.\r
4. **Lancer la double revue technique obligatoire** avant soumission :\r
  - `review-main` (ou `@review-expert`) pour les risques de merge-readiness\r
  - `@vibe-coding-refractaire` pour les smells de vibe coding, de dette structurelle et de faux signaux de qualité\r
  - Aucun finding `BLOCKER` ou `HIGH` de l'une ou l'autre passe ne doit etre ignore sans arbitrage explicite de l'utilisateur\r
5. **S'assurer que le build passe** (`dotnet build .\\InfraFlowSculptor.slnx`) avant de soumettre.\r
6. **Vérifier et mettre à jour la documentation** si les changements concernent la documentation ou s'il y a des informations à ajouter :\r
   - Parcourir les changements effectués (architecture, conventions, nouvelles APIs, etc.)\r
   - Vérifier les sections pertinentes dans `docs/`, `docs/azure/`, `README.md` ou `.Codex/memory/MEMORY.md`\r
   - Créer des sections manquantes ou mettre à jour les informations existantes\r
   - Si la feature est documentée dans une page wiki ADO, mettre à jour également\r
   - Indiquer les fichiers docs modifiés/créés dans la description de PR sous la section "Docs"\r
7. **Mettre à jour `.Codex/memory/MEMORY.md`** et inclure cette mise à jour dans la même PR.\r
8. **Exécuter le protocole Azure DevOps** (section 5) : chercher ou créer Epic/US, ajouter les Tasks, lier la PR aux work items, mettre à jour les statuts.\r
\r
---\r
\r
## 4. Scope recommandés par aggregate / composant\r
\r
| Scope              | Concerne |\r
|--------------------|---------|\r
| `infra-config`     | InfrastructureConfig aggregate |\r
| `resource-group`   | ResourceGroup aggregate |\r
| `key-vault`        | KeyVault aggregate |\r
| `redis-cache`      | RedisCache aggregate |\r
| `role-assignment`  | RoleAssignment feature |\r
| `storage-account`  | StorageAccount aggregate (futur) |\r
| `member`           | Member management within InfrastructureConfig |\r
| `bicep`            | BicepGenerator API |\r
| `aspire`           | Aspire AppHost / service orchestration |\r
| `auth`             | Authentication / authorization |\r
| `shared`           | Shared.* projects |\r
| `ef-core`          | Migrations, configurations EF Core transversales |\r
| `ci`               | GitHub Actions, Dockerfile |\r
\r
---\r
\r
## 5. Gestion Azure DevOps — Protocole obligatoire\r
\r
> Chaque PR créée par un agent **doit** être tracée dans Azure DevOps Boards.  \r
> Projet : `Infra Flow Sculptor`.  \r
> **Toutes les opérations ADO utilisent les outils MCP Azure DevOps** — aucune commande `az` CLI.\r
\r
### 5.1 Hiérarchie des work items\r
\r
```\r
Epic\r
└── User Story (US)\r
    └── Task (une par action significative réalisée)\r
```\r
\r
La chaîne minimale est **Epic → US → Tasks**.\r
\r
---\r
\r
### 5.2 Étape 1 — Rechercher une Epic et une US existantes\r
\r
Utiliser **`mcp_microsoft_azu_search_workitem`** avec les mots-clés du scope ou du titre de la PR.\r
\r
**Recherche d'une Epic :**\r
```\r
outil : mcp_microsoft_azu_search_workitem\r
  searchText  : "<scope de la PR, ex: agent, storage-account, bicep>"\r
  project     : ["Infra Flow Sculptor"]\r
  workItemType: ["Epic"]\r
  state       : ["New", "Active", "In Progress"]\r
  top         : 10\r
```\r
\r
**Recherche d'une User Story :**\r
```\r
outil : mcp_microsoft_azu_search_workitem\r
  searchText  : "<scope de la PR>"\r
  project     : ["Infra Flow Sculptor"]\r
  workItemType: ["User Story"]\r
  state       : ["New", "Active"]\r
  top         : 10\r
```\r
\r
**Critères de correspondance :**\r
- Le titre contient le scope ou le sujet principal de la PR.\r
- L'état n'est pas `Closed`, `Resolved` ou `Done`.\r
\r
---\r
\r
### 5.3 Étape 2 — Créer les items manquants\r
\r
#### Si aucune Epic correspondante n'existe\r
\r
```\r
outil : mcp_microsoft_azu_wit_create_work_item\r
  project      : "Infra Flow Sculptor"\r
  workItemType : "Epic"\r
  fields:\r
    - name: "System.Title"\r
      value: "<Titre de l'Epic — domaine fonctionnel>"\r
    - name: "System.Description"\r
      value: "<Description du domaine couvert>"\r
      format: "Html"\r
```\r
\r
Récupérer l'`id` retourné — c'est l'`ID_EPIC`.\r
\r
#### Si aucune US correspondante n'existe\r
\r
```\r
outil : mcp_microsoft_azu_wit_create_work_item\r
  project      : "Infra Flow Sculptor"\r
  workItemType : "User Story"\r
  fields:\r
    - name: "System.Title"\r
      value: "<Titre décrivant le besoin couvert par la PR>"\r
    - name: "System.Description"\r
      value: "En tant que développeur, je veux <objectif> afin de <valeur>."\r
      format: "Html"\r
```\r
\r
Puis lier l'US à l'Epic en tant qu'enfant :\r
\r
```\r
outil : mcp_microsoft_azu_wit_work_items_link\r
  project : "Infra Flow Sculptor"\r
  updates:\r
    - id      : <ID_US>\r
      linkToId: <ID_EPIC>\r
      type    : "child"\r
```\r
\r
---\r
\r
### 5.4 Étape 3 — Créer les Tâches sur l'US\r
\r
Utiliser **`mcp_microsoft_azu_wit_add_child_work_items`** pour créer toutes les Tasks en un appel :\r
\r
```\r
outil : mcp_microsoft_azu_wit_add_child_work_items\r
  project      : "Infra Flow Sculptor"\r
  parentId     : <ID_US>\r
  workItemType : "Task"\r
  items:\r
    - title      : "<Action réalisée — ex: Créer merge-main.md>"\r
      description: "<Description de ce qui a été fait>"\r
      format     : "Html"\r
    - title      : "<Autre action>"\r
      description: "<Description>"\r
```\r
\r
**Exemples de Tasks selon le type de PR :**\r
\r
| Type de PR | Tasks typiques |\r
|-----------|---------------|\r
| `feat(aggregate)` | Créer l'agrégat domaine, Ajouter commandes/queries/handlers, Configurer EF Core, Créer migration, Ajouter endpoints, Aligner frontend |\r
| `fix` | Analyser le bug, Corriger le handler/repository, Vérifier le build |\r
| `chore(agents)` | Créer fichier agent, Mettre à jour .Codex/memory/MEMORY.md, Supprimer fichiers obsolètes |\r
| `docs` | Rédiger documentation, Créer pages wiki ADO |\r
| `refactor` | Restructurer le code, Extraire helper, Vérifier non-régression |\r
\r
---\r
\r
### 5.5 Étape 4 — Lier les work items à la PR GitHub via `AB#`\r
\r
> **Méthode officielle Microsoft** (source : [Link GitHub to Azure Boards](https://learn.microsoft.com/en-us/azure/devops/boards/github/link-to-from-github?view=azure-devops))  \r
> La syntaxe `AB#ID` dans la **description** de la PR GitHub crée automatiquement un lien bidirectionnel visible dans la section "Development" du work item ADO.  \r
> **Prérequis :** le repo GitHub doit être connecté au projet ADO via l'[Azure Boards GitHub App](https://github.com/apps/azure-boards).\r
\r
#### Syntaxe `AB#` à placer dans la description de la PR GitHub\r
\r
| Syntaxe | Effet |\r
|---------|-------|\r
| `AB#65` | Lie la PR au work item #65 sans changer son état |\r
| `Fixed AB#65` | Lie + transitions l'US vers l'état `Resolved` quand la PR est mergée dans `main` |\r
| `Closed AB#65` | Lie + transitions l'US vers l'état `Closed` quand la PR est mergée dans `main` |\r
| `Fixed AB#65, Fixed AB#64` | Lie et transite les deux items |\r
| `Fixes AB#65, AB#66, AB#67` | Lie et transite uniquement le premier (#65) |\r
\r
> **Important :** `AB#` ne fonctionne que dans la **description** (body) de la PR — pas dans le titre ni dans les commentaires.\r
\r
#### Ce que doit contenir la section "Issues / tickets liés" de la PR\r
\r
```\r
Fixes AB#<ID_US>\r
AB#<ID_EPIC>\r
```\r
\r
- `Fixes AB#<ID_US>` : lie l'US **et** la fait passer en `Resolved` à la fusion vers `main`\r
- `AB#<ID_EPIC>` : lie l'Epic sans transition automatique d'état (la transition de l'Epic reste manuelle)\r
\r
#### Construire la description de la PR avec `mcp_io_github_git_update_pull_request`\r
\r
Lors de la création ou mise à jour de la PR, injecter `Fixes AB#<ID_US>` et `AB#<ID_EPIC>` dans la section "Issues / tickets liés" du corps de la PR :\r
\r
```\r
outil : mcp_io_github_git_update_pull_request (ou create_pull_request)\r
  body : "...\r
## 🔗 Issues / tickets liés\r
\r
Fixes AB#<ID_US>\r
AB#<ID_EPIC>\r
  ..."\r
```\r
\r
---\r
\r
### 5.6 Étape 5 — Mettre à jour les statuts\r
\r
**Règles de mise à jour :**\r
\r
| Situation | État cible US | État cible Tasks existantes |\r
|-----------|--------------|----------------------------|\r
| PR créée, travail en cours | `Active` | `Active` |\r
| PR fusionnée vers main | `Resolved` | `Closed` |\r
| Bug corrigé et validé | `Resolved` | `Closed` |\r
| Feature complète | `Resolved` | `Closed` |\r
\r
**Mettre à jour l'état d'un item :**\r
```\r
outil : mcp_microsoft_azu_wit_update_work_item\r
  id      : <ID_US ou ID_TASK>\r
  updates :\r
    - path : "/fields/System.State"\r
      value: "Active"   ← ou "Resolved" / "Closed"\r
```\r
\r
**Mettre à jour plusieurs items en une fois :**\r
```\r
outil : mcp_microsoft_azu_wit_update_work_items_batch\r
  updates:\r
    - id   : <ID_TASK_1>\r
      path : "/fields/System.State"\r
      value: "Closed"\r
    - id   : <ID_TASK_2>\r
      path : "/fields/System.State"\r
      value: "Closed"\r
```\r
\r
---\r
\r
### 5.7 Résumé du protocole DevOps — ordre d'exécution\r
\r
```\r
1. mcp_microsoft_azu_search_workitem  → chercher Epic correspondante\r
   ├─ Trouvée → retenir son ID\r
   └─ Non trouvée → mcp_microsoft_azu_wit_create_work_item (Epic)\r
\r
2. mcp_microsoft_azu_search_workitem  → chercher US correspondante\r
   ├─ Trouvée → retenir son ID + mettre à jour son état → Active\r
   └─ Non trouvée → mcp_microsoft_azu_wit_create_work_item (User Story)\r
                  + mcp_microsoft_azu_wit_work_items_link (US enfant de l'Epic)\r
\r
3. mcp_microsoft_azu_wit_add_child_work_items → créer toutes les Tasks sur l'US\r
\r
4. Injecter `Fixes AB#<ID_US>` et `AB#<ID_EPIC>` dans la description de la PR GitHub\r
   via mcp_io_github_git_create_pull_request ou mcp_io_github_git_update_pull_request\r
   → crée le lien bidirectionnel officiel dans la section "Development" d'ADO\r
   → `Fixes` déclenche la transition vers Resolved à la fusion dans main\r
\r
5. mcp_microsoft_azu_wit_update_work_item (ou _batch) → mettre à jour les statuts\r
\r
6. Vérifier que la section "Issues / tickets liés" de la PR contient `Fixes AB#<ID_US>` et `AB#<ID_EPIC>`\r
```\r
\r
---\r
\r
### 5.8 Référence des outils MCP utilisés\r
\r
| Outil MCP | Usage |\r
|-----------|-------|\r
| `mcp_microsoft_azu_search_workitem` | Rechercher Epics et US existantes par mots-clés |\r
| `mcp_microsoft_azu_wit_create_work_item` | Créer une Epic ou une US |\r
| `mcp_microsoft_azu_wit_add_child_work_items` | Créer toutes les Tasks en batch sous une US |\r
| `mcp_microsoft_azu_wit_work_items_link` | Lier l'US à l'Epic (relation enfant/parent) |\r
| `mcp_io_github_git_create_pull_request` ou `mcp_io_github_git_update_pull_request` | Créer/mettre à jour la PR GitHub avec `Fixes AB#<ID>` dans la description |\r
| `mcp_microsoft_azu_wit_update_work_item` | Mettre à jour l'état d'un item unique |\r
| `mcp_microsoft_azu_wit_update_work_items_batch` | Mettre à jour l'état de plusieurs items |\r
\r
> **Note :** `mcp_microsoft_azu_wit_add_artifact_link` n'est **pas** utilisé pour les repos GitHub — la syntaxe `AB#` dans la description de la PR est la méthode officielle et bidirectionnelle."""
