\r
1. Exécuter `dotnet test .\\tests\\<Assembly>.Tests\\<Assembly>.Tests.csproj` — tous les tests du projet touchés passent.\r
2. Exécuter `dotnet test .\\InfraFlowSculptor.slnx` — aucune régression sur la solution.\r
