## 19. EF Core — Règles spécifiques au projet\r
\r
### Comparaisons dans les prédicats LINQ\r
\r
```csharp\r
// ✅ Comparer les value objects entiers (EF utilise IdValueConverter)\r
.FirstOrDefaultAsync(x => x.Id == id, ct)\r
\r
// ❌ .Value — EF ne peut pas traduire cette navigation en SQL\r
.FirstOrDefaultAsync(x => x.Id.Value == id.Value, ct)\r
```\r
\r
### Chargement des entités associées\r
\r
```csharp\r
// ✅ Include explicite quand les relations sont nécessaires\r
var config = await context.InfrastructureConfigs\r
    .Include(c => c.Members)\r
    .Include(c => c.EnvironmentDefinitions)\r
    .FirstOrDefaultAsync(c => c.Id == id, ct);\r
\r
// ✅ ThenInclude pour les relations imbriquées\r
var config = await context.InfrastructureConfigs\r
    .Include(c => c.ResourceGroups)\r
        .ThenInclude(rg => rg.Resources)\r
    .FirstOrDefaultAsync(c => c.Id == id, ct);\r
```\r
\r
### Migrations\r
\r
- Toujours générer une migration après chaque changement de modèle.\r
- Nommer la migration de façon descriptive : `Add{AggregateName}`, `Add{PropertyName}To{Entity}`, `Remove{Feature}`.\r
- Vérifier le contenu généré — si la migration recrée des tables existantes, le snapshot est corrompu (voir section 17 changelog .Codex/memory/MEMORY.md).\r
