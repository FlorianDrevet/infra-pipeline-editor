## 22. Checklist de génération d'un artefact .NET\r
\r
- [ ] Lu `.Codex/memory/MEMORY.md` avant de commencer\r
- [ ] Skill `tdd-workflow` chargé — cycle RED → GREEN → REFACTOR → VERIFY appliqué\r
- [ ] Tests écrits AVANT le code de production (ou en parallèle pour scaffolding massif)\r
- [ ] Projet de tests existant pour l'assembly modifié (`tests/<Assembly>.Tests/`)\r
- [ ] Nommage conforme aux conventions Microsoft\r
- [ ] Documentation XML sur tous les membres publics/protégés\r
- [ ] Pas de magic strings — constantes, enums, ou `nameof()`\r
- [ ] SRP respecté — chaque classe a une seule responsabilité\r
- [ ] Guard clauses (early return) plutôt que pyramides\r
- [ ] `sealed` sur les classes non héritables\r
- [ ] `readonly` sur tous les champs après initialisation\r
- [ ] `ConfigureAwait(false)` dans les couches librairie\r
- [ ] `CancellationToken` propagé à tous les appels async\r
- [ ] Pas d'exception avalée silencieusement\r
- [ ] Une classe/record/struct/interface/enum public top-level par fichier\r
- [ ] Pas de fichier poubelle `Dtos.cs`, `Models.cs`, `Requests.cs`, `Responses.cs`, ou `Helpers.cs`\r
- [ ] Organisation des fichiers en sous-dossiers thématiques (Models/, Constants/, Analysis/, etc.) dès qu'un dossier dépasse ~6 fichiers ou mélange des responsabilités différentes (DTOs, logique, constantes, enums) ; le namespace doit refléter le chemin physique\r
- [ ] Pas de `object`, `dynamic`, `JsonDocument`, `JsonNode`, ou `Dictionary<string, object>` si un schéma explicite est connu\r
- [ ] Si une frontière faible est inévitable, mapping immédiat vers un modèle typé\r
- [ ] Pattern introduit seulement s'il apporte un vrai levier sur lisibilité, maintenabilité, et scalabilité\r
- [ ] `AsNoTracking()` pour les queries EF Core en lecture seule\r
- [ ] Comparaisons EF Core sur value objects entiers (pas `.Value`)\r
- [ ] Validator FluentValidation avec `WithMessage()` sur chaque règle\r
- [ ] ErrorOr pour les erreurs métier prévisibles (pas d'exception)\r
- [ ] Si la tâche touche des tests unitaires : skill `xunit-unit-testing` chargé\r
- [ ] Si la tâche touche des tests unitaires : `dotnet test` projet puis solution exécuté\r
- [ ] Build vérifié : `dotnet build .\\InfraFlowSculptor.slnx`\r
- [ ] `.Codex/memory/MEMORY.md` mis à jour si nouvelles conventions découvertes\r
