## 20. FluentValidation — Conventions\r
\r
```csharp\r
/// <summary>\r
/// Validates the <see cref="CreateKeyVaultCommand"/> before it is handled.\r
/// </summary>\r
public sealed class CreateKeyVaultCommandValidator : AbstractValidator<CreateKeyVaultCommand>\r
{\r
    public CreateKeyVaultCommandValidator()\r
    {\r
        RuleFor(x => x.Name)\r
            .NotEmpty().WithMessage("Name is required.")\r
            .MaximumLength(24).WithMessage("Name must not exceed 24 characters.")\r
            .Matches("^[a-zA-Z][a-zA-Z0-9-]*$").WithMessage("Name must start with a letter and contain only letters, digits, and hyphens.");\r
\r
        RuleFor(x => x.ResourceGroupId)\r
            .NotEmpty().WithMessage("ResourceGroupId is required.");\r
\r
        RuleFor(x => x.Sku)\r
            .IsInEnum().WithMessage("Sku must be a valid value (Standard or Premium).");\r
    }\r
}\r
```\r
\r
**Règles FluentValidation :**\r
- Un validator **par commande** — jamais de validation inline dans le handler.\r
- Les messages d'erreur en **anglais**, clairs et orientés utilisateur.\r
- `.WithMessage()` obligatoire sur chaque règle — jamais le message par défaut.\r
- Pour les enums : `IsInEnum()` ou `Must(x => Enum.IsDefined(...))`.\r
\r
