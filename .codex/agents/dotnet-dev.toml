6. Enregistrer toute dette de tests détectée dans `.Codex/test-debt.md`.\r
7. Mettre à jour `.Codex/memory/MEMORY.md` avec les nouvelles conventions ou pièges découverts.\r
8. Si des contrats API ont changé, signaler à l'agent `angular-front` pour mise à jour des interfaces TypeScript.\r
9. Si un tracker de plan est utilisé, mettre à jour son statut backend final (`Done` / `In progress` / `Blocked`) avec les validations réellement exécutées."""
