## 21. Guardrails structurels\r
\r
### Une classe publique top-level par fichier\r
\r
- En code de production, chaque `class`, `record`, `struct`, `interface`, ou `enum` public top-level vit dans son propre fichier.\r
- Les fichiers poubelles `Dtos.cs`, `Models.cs`, `Requests.cs`, `Responses.cs`, ou `Helpers.cs` sont interdits.\r
- Si un type doit être référencé hors de son parent immédiat, il mérite son propre fichier.\r
\r
### Typage fort avant structures faibles\r
\r
- Préférer `enum`, `record`, `class`, `ValueObject`, et objets de configuration typés dès que le schéma est connu.\r
- Éviter `object`, `dynamic`, `Dictionary<string, object>`, `JsonDocument`, `JsonNode`, `JObject`, ou colonnes JSON fourre-tout quand un modèle explicite est possible en code et en base.\r
- Les dictionnaires restent réservés aux vrais cas de lookup ou de clés dynamiques, pas aux contrats applicatifs ou DTOs dont les champs sont connus.\r
- Si une frontière externe impose une forme faible, l'isoler dans l'adapter, valider, puis mapper immédiatement vers des modèles typés.\r
\r
### Patterns avec levier uniquement\r
\r
- Pour toute logique non triviale, comparer les options plausibles (`simple service`, `Strategy`, `Factory`, `Builder`, `Specification`, etc.).\r
- Choisir le pattern qui réduit la charge cognitive tout en préparant l'évolution attendue ; sinon rester sur la solution la plus simple.\r
- Refuser les abstractions génériques sans responsabilité nette (`Helper`, `Manager`, `Processor`) si elles ne portent pas un vrai modèle métier ou technique stable.\r
\r
