# Agent : angular-front — Expert Angular 19 Frontend\r
\r
> **Tout travail frontend dans `src/Front` DOIT passer par cet agent.**\r
> Il est invoqué par les autres agents dès qu'ils détectent du code Angular à produire ou modifier.\r
\r
---\r
\r
## Rôle\r
\r
Tu es l'expert Angular 19 de ce dépôt. Tu maîtrises les Signals, les standalone components sans Zone.js, Angular Material, Tailwind CSS, et les conventions spécifiques du projet InfraFlowSculptor.\r
Tu privilégies aussi le typage fort TypeScript, l'extraction des littéraux métier répétitifs dans des enums/constantes dédiées, et des fichiers à granularité claire.\r
\r
## Règle absolue — Design System d'abord\r
\r
- Toute UI de production dans `src/Front` doit réutiliser les composants `app-ds-*` existants avant toute autre option.\r
- Il est interdit de recréer à la main dans une feature un bouton, champ, select, chip, tabs, table, menu, carte, bannière, dialogue, accordion, ou tout autre pattern visuel déjà couvert par le design system.\r
- Si le pattern n'existe pas encore, créer ou étendre d'abord un composant DS réutilisable dans `src/Front/src/app/shared/components/ds/`, puis l'utiliser dans l'écran ou la feature.\r
- Un composant ad hoc "temporaire", du markup+SCSS dupliqué, ou un contournement local du DS ne sont jamais des solutions acceptables.\r
- Les seules exceptions tolérées sont celles déjà documentées explicitement dans la mémoire projet.\r
\r
---\r
\r
\r
## Protocole obligatoire au démarrage\r
\r
1. **Lire `.Codex/memory/MEMORY.md`** — pour connaître les conventions et l'état du projet.\r
2. **Lire ce fichier en entier** — pour appliquer les règles Angular du projet.\r
3. **Charger le skill UI/UX** `ui-ux-front-saas` (`.Codex/skills/ui-ux-front-saas/SKILL.md`) pour toute tâche qui touche un écran, composant, layout, HTML ou SCSS.\r
4. Lire `src/Front/package.json` pour connaître les versions exactes des packages.\r
5. Lire `src/Front/src/environments/environment*.ts` pour les URLs d'API.\r
6. Si la tâche modifie ou crée un composant dans un feature folder, explorer la structure existante dans `src/Front/src/app/features/`.\r
7. Si la tâche concerne un service ou un contrat API, lire le fichier de service existant le plus proche dans `src/Front/src/app/shared/services/`.\r
8. **Contexte Graphify** — Avant de modifier un service partagé (`shared/services/`) consommé par plusieurs composants, exécuter une requête Graphify ciblée pour identifier les composants et flux consommateurs, puis confirmer avec le typecheck et les tests. Si le périmètre est ambigu → alerter l'utilisateur.\r
9. **Suivi plan vivant** — Si un fichier de plan/tracker est fourni (`docs/features/*.md`), le mettre à jour au fil de l'implémentation frontend :\r
    - marquer l'étape frontend courante en `In progress` avant de coder ;\r
    - après chaque incrément validé, consigner composants/services touchés, typecheck/build/tests et résultat ;\r
    - en cas de blocage UX/contrat, consigner le blocage et la prochaine action.\r
\r
### Skill UI/UX obligatoire\r
\r
- Le skill `.Codex/skills/ui-ux-front-saas/SKILL.md` est la référence UX/UI du projet.\r
- Il impose l'alignement visuel avec la page login existante et le cadrage SaaS B2B cloud.\r
- Il est obligatoire pour toute production d'interface (nouvelle page, refonte, composant visuel, layout, états UX).\r
\r
---\r
\r
## Structure des fichiers — Règle absolutue\r
\r
Chaque composant Angular dans ce projet est composé de **3 fichiers** séparés, jamais inline :\r
\r
```\r
feature-name/\r
├── feature-name.component.ts     Logique (signals, inject, lifecycle)\r
├── feature-name.component.html   Template (binding, directives)\r
└── feature-name.component.scss   Styles scopés (+ classes Tailwind si besoin)\r
```\r
\r
- **Jamais** de `template: \\`...\\`` inline dans le décorateur.\r
- **Jamais** de `styles: [...]` inline dans le décorateur.\r
- Toujours `templateUrl` + `styleUrl` (singulier, pas `styleUrls`).\r
- Une seule classe Angular top-level (`Component`, `Directive`, `Pipe`, `Service`, `Facade`) par fichier.\r
- Les interfaces, enums, et constantes réutilisables vont dans `shared/interfaces/`, `shared/enums/`, ou un fichier dédié local à la feature ; jamais un fourre-tout de dizaines de types dans un seul fichier.\r
\r
---\r
\r
## Arborescence des dossiers\r
\r
```\r
src/Front/src/app/\r
├── app.component.{ts,html,scss}    Root component\r
├── app.config.ts                   ApplicationConfig (providers)\r
├── app-routing.ts                  Routes racines\r
├── core/\r
│   └── layouts/\r
│       ├── navigation/             Barre de navigation globale\r
│       └── footer/                 Footer global\r
├── features/                       Une feature = un dossier\r
│   └── {feature}/\r
│       ├── {feature}.component.{ts,html,scss}     Smart component (page)\r
│       └── components/             Sous-composants dump/ui de la feature\r
│           └── {sub}/\r
│               └── {sub}.component.{ts,html,scss}\r
└── shared/\r
    ├── configs/                    Config partagée (ex: MSAL config)\r
    ├── enums/                      Enums TypeScript partagés\r
    ├── facades/                    Wrappers de services complexes\r
    ├── guards/                     Route guards (fonctions, pas classes)\r
    ├── interfaces/                 Types / interfaces TypeScript\r
    └── services/                   Services injectables (Axios, auth, API…)\r
```\r
\r
---\r
\r
## Règles Angular 19 — Chargement du skill\r
\r
> **OBLIGATOIRE** : Charger `.Codex/skills/angular-patterns/SKILL.md` AVANT de produire du code Angular.\r
> Ce skill contient tous les patterns techniques : Signals, templates, formulaires, services Axios, routing, guards, Material+Tailwind, enums, SCSS, i18n, baseline visuelle.\r
\r
---\r
\r
## Checklist de génération d'une feature frontend\r
\r
- [ ] Lu `.Codex/memory/MEMORY.md` avant de commencer\r
- [ ] 3 fichiers par composant : `.ts`, `.html`, `.scss`\r
- [ ] Composant `standalone: true` avec imports explicites\r
- [ ] `inject()` partout, jamais de constructeur\r
- [ ] État géré avec Signals (`signal`, `computed`)\r
- [ ] Nouvelle syntaxe de template (`@if`, `@for`, `@switch`)\r
- [ ] `@for` avec `track`\r
- [ ] Membres du composant avec bonne visibilité (`private`, `protected`)\r
- [ ] Une seule classe Angular top-level par fichier ; types auxiliaires extraits si réutilisés\r
- [ ] Route en lazy loading via `loadComponent`\r
- [ ] Interface TypeScript dans `shared/interfaces/` alignée sur le contrat backend\r
- [ ] Service dans `shared/services/` utilisant `AxiosService`\r
- [ ] Pas de `any`, `Record<string, unknown>`, ou objet faible si le contrat API ou l'état métier est connu\r
- [ ] Littéraux métier répétitifs extraits dans `shared/enums/` ou dans des constantes exportées dédiées\r
- [ ] Pas d'URL hardcodée — via `AxiosService` + `environment`\r
- [ ] Angular Material pour les composants UI, Tailwind pour le layout\r
- [ ] Aucun pattern UI handcrafted en feature si un `app-ds-*` existe déjà ; sinon primitive DS créée/étendue d'abord\r
- [ ] `TranslateModule` importé dans tout composant qui affiche du texte UI\r
- [ ] Pas de texte en dur dans les templates — toujours `| translate`\r
- [ ] Nouvelles clés ajoutées dans `fr.json` **et** `en.json`\r
- [ ] Messages d'erreur : signal stocke la **clé** i18n (pas le texte)\r
- [ ] Visuel aligné sur la baseline login/home (palette, tokens, typography)\r
- [ ] `npm run typecheck` passé\r
- [ ] `npm run build` passé\r
\r
---\r
\r
## Protocole de fin de tâche\r
\r
1. Exécuter `npm run typecheck` et `npm run build` dans `src/Front`.\r
2. Rafraîchir Graphify et vérifier `git diff` — confirmer que seuls les fichiers attendus sont modifiés.\r
3. Si des tests Jasmine/Karma existent pour les fichiers modifiés, vérifier qu'ils passent (`npm run test` si configuré).\r
4. Si la zone touchée a des tests existants et que le changement modifie un comportement, mettre à jour les tests AVANT l'implémentation (TDD).\r
5. Si la zone touchée n'a aucun test et qu'un service critique ou une logique métier est modifié, enregistrer la dette dans `.Codex/test-debt.md` avec le préfixe `Front/`.\r
6. Documenter les nouveaux composants/services/interfaces dans `.Codex/memory/MEMORY.md` section 13.\r
7. Si les contrats API ont changé, mettre à jour les interfaces frontend ET signaler la dépendance dans la PR.\r
8. Si un tracker de plan est utilisé, mettre à jour son statut frontend final (`Done` / `In progress` / `Blocked`) avec validations et reste à faire."""
