<aside class="sidebar" [class.sidebar--collapsed]="collapsed()">
  <header class="sidebar__header">
    <a class="sidebar__brand" routerLink="/" [attr.aria-label]="'SIDEBAR.BRAND_ARIA' | translate">
      <span class="sidebar__brand-mark" aria-hidden="true">IFS</span>
      <span class="sidebar__brand-dot" aria-hidden="true"></span>
    </a>
    <span class="sidebar__spacer"></span>
    <app-ds-icon-button
      class="sidebar__toggle"
      size="sm"
      variant="neutral"
      [icon]="toggleIcon()"
      [ariaLabel]="toggleAriaLabelKey() | translate"
      (clicked)="onToggle()"
    ></app-ds-icon-button>
  </header>

  <nav class="sidebar__nav" [attr.aria-label]="'SIDEBAR.NAV_ARIA' | translate">
    <ul class="sidebar__list">
      @for (item of items; track item.id) {
        <li class="sidebar__item">
          <a
            class="sidebar__link"
            [routerLink]="item.routerLink"
            routerLinkActive="sidebar__link--active"
            [routerLinkActiveOptions]="{ exact: !!item.exact }"
            [attr.title]="collapsed() ? (item.labelKey | translate) : null"
          >
            <mat-icon class="sidebar__icon" aria-hidden="true">{{ item.icon }}</mat-icon>
            <span class="sidebar__label">{{ item.labelKey | translate }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>
</aside>
