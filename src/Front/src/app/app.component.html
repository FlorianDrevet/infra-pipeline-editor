<div class="app-shell" [class.app-shell--login]="isLoginPage()">
  @if (!isLoginPage()) {
    <a class="skip-link" href="#main-content">{{ 'NAV.SKIP_TO_CONTENT' | translate }}</a>
    <app-sidebar class="app-shell__sidebar"></app-sidebar>
    <app-navigation class="app-shell__topbar"></app-navigation>
    <main id="main-content" class="app-shell__main" tabindex="-1">
      <router-outlet></router-outlet>
    </main>
    <app-footer class="app-shell__footer"></app-footer>
  } @else {
    <main class="app-shell__main app-shell__main--login">
      <router-outlet></router-outlet>
    </main>
  }

  @if (isAnnotationEnabled) {
    <agent-ui-annotation #annotationRef theme="auto" output-level="standard"></agent-ui-annotation>
  }

  @if (isAnnotationEnabled && !isLoginPage()) {
    <button
      type="button"
      class="annotation-trigger"
      (click)="activateAnnotation()"
      [attr.aria-label]="'ANNOTATION.ACTIVATE_ARIA' | translate"
      [attr.title]="'ANNOTATION.ACTIVATE' | translate"
    >
      AI
    </button>
  }
</div>
