<h2 mat-dialog-title>{{ 'PROJECT_DETAIL.MEMBERS.ADD_DIALOG_TITLE' | translate }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="add-member-form" (ngSubmit)="onSubmit()">
    <app-ds-autocomplete
      formControlName="userSearch"
      [label]="'PROJECT_DETAIL.MEMBERS.ADD_DIALOG_USER_LABEL' | translate"
      [placeholder]="'PROJECT_DETAIL.MEMBERS.ADD_DIALOG_SEARCH_PLACEHOLDER' | translate"
      [options]="userOptions()"
      [emptyStateLabel]="'PROJECT_DETAIL.MEMBERS.ADD_DIALOG_NO_RESULTS' | translate"
      prefixIcon="search"
      [clearable]="true"
      (searchChanged)="onSearchInput($event)"
      (optionSelected)="onUserSelected($event)" />

    <app-ds-select
      formControlName="role"
      [label]="'PROJECT_DETAIL.MEMBERS.ADD_DIALOG_ROLE_LABEL' | translate"
      [options]="roleOptions" />

    @if (errorKey()) {
      <p class="dialog-error">{{ errorKey() | translate }}</p>
    }
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <app-ds-button variant="ghost" (clicked)="onCancel()" [disabled]="isSubmitting()">
    {{ 'PROJECT_DETAIL.MEMBERS.ADD_DIALOG_CANCEL' | translate }}
  </app-ds-button>
  <app-ds-button variant="primary" [loading]="isSubmitting()" [disabled]="form.invalid || !selectedUser()" (clicked)="onSubmit()">
    {{ 'PROJECT_DETAIL.MEMBERS.ADD_DIALOG_ADD' | translate }}
  </app-ds-button>
</mat-dialog-actions>
