<div
  class="ds-skeleton"
  [class.ds-skeleton--box]="variant() === 'box'"
  [class.ds-skeleton--line]="variant() === 'line'"
  [class.ds-skeleton--circle]="variant() === 'circle'"
  [style.gap]="gap()"
  aria-hidden="true"
>
  @for (_ of items(); track $index) {
    <span
      class="ds-skeleton__item"
      [style.width]="itemStyle().width"
      [style.height]="itemStyle().height"
    ></span>
  }
</div>
