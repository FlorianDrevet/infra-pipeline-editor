<div
  class="ds-seg ds-seg--{{ size() }}"
  [attr.aria-label]="ariaLabel() ?? null"
  [attr.aria-disabled]="disabledByForm() ? true : null"
>
  @for (option of options(); track option.value; let index = $index) {
    <button
      #optionButton
      type="button"
      class="ds-seg__option"
      [class.ds-seg__option--selected]="isSelected(option)"
      [class.ds-seg__option--disabled]="isDisabled(option)"
      [attr.aria-pressed]="isSelected(option)"
      [attr.aria-disabled]="isDisabled(option) ? true : null"
      [attr.tabindex]="isSelected(option) ? 0 : -1"
      [disabled]="isDisabled(option)"
      (click)="onSelect(option)"
      (keydown)="onKeyDown($event, index)"
    >
      @if (option.icon) {
        <mat-icon class="ds-seg__icon" aria-hidden="true">{{ option.icon }}</mat-icon>
      }
      <span class="ds-seg__label">{{ option.label }}</span>
    </button>
  }
</div>
