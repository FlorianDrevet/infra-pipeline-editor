<span
  class="ds-spinner ds-spinner--{{ size() }}"
  [class.ds-spinner--inline]="inline()"
  role="status"
  [attr.aria-label]="hasCustomLabel() ? label() : (resolvedLabelKey() | translate)"
>
  <svg
    class="ds-spinner__svg"
    [attr.width]="diameter()"
    [attr.height]="diameter()"
    viewBox="0 0 64 64"
    aria-hidden="true"
    focusable="false"
  >
    <path
      class="ds-spinner__path"
      d="M32 16 L18 44 L46 44 Z"
      [attr.stroke]="'url(#' + gradientId() + ')'"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <circle class="ds-spinner__node ds-spinner__node--a" cx="32" cy="16" r="4.5" fill="var(--ifs-brand-blue)"/>
    <circle class="ds-spinner__node ds-spinner__node--b" cx="18" cy="44" r="4.5" fill="var(--ifs-brand-cyan)"/>
    <circle class="ds-spinner__node ds-spinner__node--c" cx="46" cy="44" r="4.5" fill="var(--ifs-brand-cyan-light, #00bcd4)"/>
    <defs>
      <linearGradient [attr.id]="gradientId()" x1="18" y1="16" x2="46" y2="44" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#1565c0"/>
        <stop offset="0.5" stop-color="#0288d1"/>
        <stop offset="1" stop-color="#00bcd4"/>
      </linearGradient>
    </defs>
  </svg>
</span>
