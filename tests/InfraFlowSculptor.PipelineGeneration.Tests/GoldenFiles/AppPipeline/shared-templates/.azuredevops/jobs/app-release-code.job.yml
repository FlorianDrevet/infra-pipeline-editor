# Release deployment job (per environment) for code-mode apps — Auto-generated by InfraFlowSculptor

parameters:
  - name: resourceName
    type: string
  - name: resourceType
    type: string
  - name: envShortName
    type: string
  - name: envName
    type: string
  - name: runSmokeTests
    type: boolean
    default: false
  - name: smokeTestCommand
    type: string
    default: ''
  - name: enableNotifications
    type: boolean
    default: false
  - name: notificationWebhookUrl
    type: string
    default: ''

jobs:
  - deployment: Deploy_${{ parameters.envShortName }}
    displayName: 'Deploy ${{ parameters.resourceName }} to ${{ parameters.envName }}'
    environment: ${{ parameters.envShortName }}
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: none

            - template: ../steps/app-load-metadata.step.yml

            - template: ../steps/app-deploy-code.step.yml
              parameters:
                resourceType: ${{ parameters.resourceType }}

            - ${{ if parameters.runSmokeTests }}:
              - template: ../steps/app-smoke-test.step.yml
                parameters:
                  smokeTestCommand: ${{ parameters.smokeTestCommand }}

            - ${{ if parameters.enableNotifications }}:
              - template: ../steps/app-notification.step.yml
                parameters:
                  notificationWebhookUrl: ${{ parameters.notificationWebhookUrl }}