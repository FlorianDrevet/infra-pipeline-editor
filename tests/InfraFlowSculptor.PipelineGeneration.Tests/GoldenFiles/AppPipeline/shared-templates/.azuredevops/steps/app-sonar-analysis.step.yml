# Run SonarQube/SonarCloud static analysis — Auto-generated by InfraFlowSculptor

parameters:
  - name: sonarProjectKey
    type: string
  - name: sonarOrganization
    type: string
    default: ''
  - name: sonarServiceConnection
    type: string

steps:
  - task: SonarQubePrepare@6
    displayName: 'Prepare SonarQube analysis'
    inputs:
      SonarQube: ${{ parameters.sonarServiceConnection }}
      scannerMode: 'CLI'
      configMode: 'manual'
      cliProjectKey: ${{ parameters.sonarProjectKey }}
      ${{ if ne(parameters.sonarOrganization, '') }}:
        cliOrganization: ${{ parameters.sonarOrganization }}

  - task: SonarQubeAnalyze@6
    displayName: 'Run SonarQube analysis'

  - task: SonarQubePublish@6
    displayName: 'Publish SonarQube quality gate result'
    inputs:
      pollingTimeoutSec: '300'