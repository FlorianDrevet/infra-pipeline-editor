# License compliance check — Auto-generated by InfraFlowSculptor

parameters:
  - name: licenseCheckTool
    type: string
    default: 'license-checker'
  - name: runtimeStack
    type: string
    default: 'DOTNETCORE'
  - name: sourcePath
    type: string
    default: '.'

steps:
  - powershell: |
      $tool = '${{ parameters.licenseCheckTool }}'
      Write-Host "License compliance check with: $tool"
      switch ($tool) {
          'dotnet-delice' {
              dotnet tool install --global dotnet-delice --ignore-failed-sources 2>$null
              dotnet delice check --project '${{ parameters.sourcePath }}'
          }
          'license-checker' {
              npx license-checker --failOn 'GPL-3.0;AGPL-3.0'
          }
          'licensefinder' {
              license_finder
          }
          default {
              Invoke-Expression $tool
          }
      }
      if ($LASTEXITCODE -ne 0) {
          throw "License compliance check failed with exit code $LASTEXITCODE"
      }
    displayName: 'License compliance check'
    workingDirectory: ${{ parameters.sourcePath }}