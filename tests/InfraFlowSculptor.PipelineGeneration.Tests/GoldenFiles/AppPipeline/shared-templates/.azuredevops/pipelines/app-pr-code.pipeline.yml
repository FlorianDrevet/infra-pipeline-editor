# PR validation pipeline template for code-mode apps - Auto-generated by InfraFlowSculptor
# Usage: extends: template: ../../.azuredevops/pipelines/app-pr-code.pipeline.yml

parameters:
  - name: resourceName
    type: string
  - name: resourceType
    type: string
  - name: runtimeStack
    type: string
    default: 'DOTNETCORE'
  - name: runtimeVersion
    type: string
    default: '8.0'
  - name: sourcePath
    type: string
    default: '.'
  - name: testCommand
    type: string
    default: ''
  - name: buildCommand
    type: string
    default: ''
  - name: agentPoolName
    type: string
    default: ''

stages:
  - stage: Validate
    displayName: 'Validate pull request application code'
    pool:
      ${{ if eq(parameters.agentPoolName, '') }}:
        vmImage: 'ubuntu-latest'
      ${{ if ne(parameters.agentPoolName, '') }}:
        name: '${{ parameters.agentPoolName }}'
    jobs:
      - template: ../jobs/app-pr-code.job.yml
        parameters:
          resourceName: ${{ parameters.resourceName }}
          resourceType: ${{ parameters.resourceType }}
          runtimeStack: ${{ parameters.runtimeStack }}
          runtimeVersion: ${{ parameters.runtimeVersion }}
          sourcePath: ${{ parameters.sourcePath }}
          testCommand: ${{ parameters.testCommand }}
          buildCommand: ${{ parameters.buildCommand }}