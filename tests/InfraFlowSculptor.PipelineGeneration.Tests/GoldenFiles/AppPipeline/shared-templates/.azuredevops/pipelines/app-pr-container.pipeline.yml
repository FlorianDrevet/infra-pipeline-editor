# PR validation pipeline template for container-mode apps - Auto-generated by InfraFlowSculptor
# Usage: extends: template: ../../.azuredevops/pipelines/app-pr-container.pipeline.yml

parameters:
  - name: resourceName
    type: string
  - name: configName
    type: string
  - name: resourceType
    type: string
  - name: imageRepository
    type: string
  - name: imageTagPattern
    type: string
    default: '{buildNumber}-{shortSha}'
  - name: dockerfilePath
    type: string
    default: 'Dockerfile'
  - name: buildContext
    type: string
    default: '.'
  - name: agentPoolName
    type: string
    default: ''

stages:
  - stage: Validate
    displayName: 'Validate pull request image build'
    pool:
      ${{ if eq(parameters.agentPoolName, '') }}:
        vmImage: 'ubuntu-latest'
      ${{ if ne(parameters.agentPoolName, '') }}:
        name: '${{ parameters.agentPoolName }}'
    jobs:
      - template: ../jobs/app-pr-container.job.yml
        parameters:
          resourceName: ${{ parameters.resourceName }}
          configName: ${{ parameters.configName }}
          resourceType: ${{ parameters.resourceType }}
          imageRepository: ${{ parameters.imageRepository }}
          imageTagPattern: ${{ parameters.imageTagPattern }}
          dockerfilePath: ${{ parameters.dockerfilePath }}
          buildContext: ${{ parameters.buildContext }}